# KIUQ SYSTEM Production Coturn Configuration
# Deploy on Ubuntu/Debian VPS or via deploy/coturn/docker-compose.yml

listening-port=3478
tls-listening-port=5349

# Replace with your server's public IPv4 (and private IP if behind AWS/Cloud NAT: external-ip=PUBLIC_IP/PRIVATE_IP)
# external-ip=YOUR_SERVER_PUBLIC_IP

# Replace with your TURN domain & Let's Encrypt TLS certificates
realm=turn.example.com
server-name=turn.example.com
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

# Ephemeral REST API HMAC-SHA1 authentication (matches WEBRTC_TURN_SECRET in Laravel .env)
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_STRONG_64_CHAR_HEX_SECRET

# Relay port range (open UDP 49152-65535 in firewall)
min-port=49152
max-port=65535

# Security hardening: block loopback & private LAN relay SSRF
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

total-quota=300
stale-nonce=600
proc-user=turnserver
proc-group=turnserver
log-file=stdout
