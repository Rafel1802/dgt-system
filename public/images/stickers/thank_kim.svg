<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background transparent cutout -->
  <g filter="url(#shadow)">
    <!-- Caption Top -->
    <rect x="25" y="10" width="150" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="100" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">Thank ... Kim 🇰🇭</text>
    
    <!-- Kim Avatar Graphic -->
    <circle cx="100" cy="85" r="38" fill="#fbd38d" stroke="#ffffff" stroke-width="4"/>
    <!-- Hair -->
    <path d="M 66 82 C 65 52, 135 50, 134 82 C 122 66, 78 66, 66 82 Z" fill="#18181b"/>
    <!-- Eyes -->
    <circle cx="88" cy="84" r="3.5" fill="#18181b"/>
    <circle cx="112" cy="84" r="3.5" fill="#18181b"/>
    <circle cx="89.5" cy="82.5" r="1.2" fill="#ffffff"/>
    <circle cx="113.5" cy="82.5" r="1.2" fill="#ffffff"/>
    <!-- Friendly Smile -->
    <path d="M 91 97 Q 100 106 109 97" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Suit Body -->
    <path d="M 52 175 L 56 128 C 65 116, 135 116, 144 128 L 148 175 Z" fill="url(#suitGrad)" stroke="#ffffff" stroke-width="3"/>
    <!-- White Shirt Collar -->
    <polygon points="100,146 86,120 114,120" fill="#ffffff"/>
    <!-- Red Tie -->
    <polygon points="98,124 102,124 105,148 100,158 95,148" fill="#dc2626"/>
  </g>
</svg>
