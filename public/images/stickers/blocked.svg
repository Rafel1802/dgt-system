<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <!-- Dog Face -->
    <circle cx="100" cy="85" r="46" fill="#d97706" stroke="#ffffff" stroke-width="4"/>
    <!-- Ears -->
    <path d="M 60 60 Q 40 90 56 105 Z" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <path d="M 140 60 Q 160 90 144 105 Z" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="85" cy="80" r="5" fill="#1e1b4b"/>
    <circle cx="115" cy="80" r="5" fill="#1e1b4b"/>
    <!-- Snout -->
    <ellipse cx="100" cy="98" rx="14" ry="10" fill="#fde68a"/>
    <circle cx="100" cy="94" r="4.5" fill="#1e1b4b"/>
    <!-- Paw gesture -->
    <circle cx="100" cy="128" r="14" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="35" y="150" width="130" height="36" rx="18" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <text x="100" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">Blocked 🚫</text>
  </g>
</svg>